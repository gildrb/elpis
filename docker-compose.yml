# Canonical deployment. Qualification controls are internal, not supported profiles.
services:
  inference:
    image: ${QWEN_IMAGE:-qwen-inference:local}
    build: .
    # Rootless default maps container root to the operator; rootful must set host UID:GID.
    user: "${QWEN_CONTAINER_USER:-0:0}"
    init: true
    restart: unless-stopped
    stop_grace_period: 60s
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    shm_size: 32gb
    tmpfs:
      - /run:rw,noexec,nosuid,size=64m
      - /tmp:rw,noexec,nosuid,size=2g
    ports:
      - "127.0.0.1:${QWEN_PORT:-18020}:18020"
    environment:
      QWEN_MEM_FRACTION_STATIC: ${QWEN_MEM_FRACTION_STATIC:-0.94}
      QWEN_QUALIFICATION: ${QWEN_QUALIFICATION:-speculative}
      QWEN_QUALIFICATION_EXECUTION: ${QWEN_QUALIFICATION_EXECUTION:-default}
      QWEN_QUALIFICATION_KV: ${QWEN_QUALIFICATION_KV:-fp8}
      QWEN_QUALIFICATION_CONTEXT: ${QWEN_QUALIFICATION_CONTEXT:-262144}
      QWEN_ALLOW_UNQUALIFIED: ${QWEN_ALLOW_UNQUALIFIED:-0}
    healthcheck:
      test: [CMD, python3, /opt/qwen/serve/healthcheck.py]
      interval: 30s
      timeout: 315s
      start_period: 20m
      retries: 3
    volumes:
      - type: bind
        source: ${QWEN_STATE_ROOT:?Set QWEN_STATE_ROOT to the existing model state directory}/qwen-inference-launch.lock
        target: /run/qwen-inference-launch.lock
        bind:
          create_host_path: false
      - type: bind
        source: ${QWEN_STATE_ROOT:?Set QWEN_STATE_ROOT to the existing model state directory}/models
        target: /models
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${QWEN_STATE_ROOT:?Set QWEN_STATE_ROOT to the existing model state directory}/api-key
        target: /app/api_key.txt
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${QWEN_STATE_ROOT:?Set QWEN_STATE_ROOT to the existing model state directory}/cache
        target: /cache
        bind:
          create_host_path: false
    deploy:
      resources:
        limits:
          cpus: "8"
          memory: 48G
        reservations:
          devices:
            - driver: cdi
              device_ids: ["nvidia.com/gpu=0"]
              capabilities: [gpu]
