model = "qwen3.8-27b"
api_base_url = "http://127.0.0.1:18020/v1"
api_key_var = "QWEN_API_KEY"
api_client_type = "openai_chat_completions"
max_concurrent = 1
independent_scoring = true
num_workers = 1
disable_env_server = true
disable_tui = true
save_results = true
save_to_hf_hub = false
output_dir = "results"
state_columns = ["trajectory"]
max_retries = 0

num_examples = 1
rollouts_per_example = 1

[sampling]
# Re-frozen for segment 1 (2026-09-22): the historical 0.6/0.95/20 sampling is
# incompatible with the Bend-native DFLASH candidate, which admits greedy
# acceptance only and crashed the scheduler on the first 178769-token request
# (demonstrated flaw; runner-parameter re-freeze per the bottleneck protocol).
# Greedy removes the sampler from the measured path entirely.
max_tokens = 8192
temperature = 0.0
top_p = 1.0
frequency_penalty = 0.0
presence_penalty = 0.0

[sampling.extra_body]
top_k = -1
min_p = 0.0
repetition_penalty = 1.0
seed = 0
# New segment generation seed; historical profiles only froze the dataset seed.

[sampling.extra_body.chat_template_kwargs]
enable_thinking = true

[[eval]]
id = "graphwalks"
name = "diverse-direct-graphwalks-bfs"

[eval.args]
split = "train"
scoring = "exact"
problem_type = "bfs"
prompt_chars_filter = "131073-262144"
shuffle = false
seed = 0
num_examples = -1
