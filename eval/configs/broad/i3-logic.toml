# Broad autoresearch lane (bench/exl3.py TASKSETS, protocol
# exl3-native-broad-c1-request-v3): sampled logic only, not full qualification.
# Pinned Verifiers shuffle uses native seed 0 before selecting these 4 tasks: the first
# 4 of v2's 6, so the lane fits its 2400 s deadline at the 250 W operating point.
# 16384-token per-call budget (sampling.max_tokens; env.agent.max_output_tokens is the
# matching soft episode cap) keeps the lane under its deadline. Truncations are
# reported per run (i3_logic_truncated), never hidden.
num_tasks = 4
num_rollouts = 1
max_concurrent = 1
shuffle = true
push = false

[env.taskset]
id = "i3-logic"

[env.agent]
max_turns = 1
max_output_tokens = 16384

[env.agent.timeout]
setup = 600.0
rollout = 1800.0
scoring = 600.0

[env.agent.harness]
id = "null"

[env.agent.harness.env]
UV_LOCKED = "true"
UV_PYTHON = "3.12"
UV_PYTHON_DOWNLOADS = "never"

[env.agent.runtime]
type = "docker"
image = "qwen-prime-eval:locked"
workdir = "/workspace"
cpu = 2.0
memory = 4.0
allow = []

[sampling]
max_tokens = 16384
