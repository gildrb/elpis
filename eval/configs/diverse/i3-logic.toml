# First native eligible source-order row; separate limited-budget sentinel.
# Sampling deep-merges over ../local.toml: greedy and thinking stay unchanged.
num_tasks = 1
num_rollouts = 1
max_concurrent = 1
shuffle = false
push = false

[sampling]
max_tokens = 8192

[env.taskset]
id = "i3-logic"

[env.agent]
max_turns = 1
max_output_tokens = 8192

[env.agent.timeout]
setup = 600.0
rollout = 1800.0
scoring = 600.0

[env.agent.harness]
id = "null"

[env.agent.harness.env]
UV_LOCKED = "true"
UV_PYTHON = "3.12"
UV_PYTHON_DOWNLOADS = "never"

[env.agent.runtime]
type = "docker"
image = "qwen-prime-eval:locked"
workdir = "/workspace"
cpu = 2.0
memory = 4.0
allow = []
