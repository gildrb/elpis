# Endpoint and sampling are shared unchanged by every profile.
# 2026-09-14: greedy (temperature 0, top_p 1, no top_k) and a 32768-token
# budget. Rationale: at 8192 with thinking-on, 70% of episodes ended in
# length-truncation (auto-zero), measuring the cap rather than the model.
# Runner parameters, not benchmark task/scoring changes; prime-envs and
# verifiers pins unchanged. Numbers before/after this change are not
# comparable.
model = "qwen3.8-27b"
[client]
type = "eval"
base_url = "http://127.0.0.1:18020/v1"
api_key_var = "QWEN_API_KEY"

[sampling]
max_tokens = 32768
temperature = 0.0
top_p = 1.0
frequency_penalty = 0.0
presence_penalty = 0.0

[sampling.extra_body]
min_p = 0.0
repetition_penalty = 1.0

[sampling.extra_body.chat_template_kwargs]
enable_thinking = true

[serve]
max_concurrent = 1

[serve.pool]
type = "static"
num_workers = 1

