# Endpoint and sampling are shared unchanged by every profile.
model = "qwen3.8-27b"
[client]
type = "eval"
base_url = "http://127.0.0.1:18020/v1"
api_key_var = "QWEN_API_KEY"

[sampling]
max_tokens = 8192
temperature = 0.6
top_p = 0.95
frequency_penalty = 0.0
presence_penalty = 0.0

[sampling.extra_body]
top_k = 20
min_p = 0.0
repetition_penalty = 1.0

[sampling.extra_body.chat_template_kwargs]
enable_thinking = true

[serve]
max_concurrent = 1

[serve.pool]
type = "static"
num_workers = 1

